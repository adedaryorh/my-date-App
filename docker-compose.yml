version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: celebut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-celebut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celebut_password}
      POSTGRES_DB: ${POSTGRES_DB:-celebut}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/goose/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: celebut-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for message queuing
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: celebut-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celebut-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Database connection
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER:-celebut}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-celebut_password}
      PG_DATABASE: ${POSTGRES_DB:-celebut}

      # Redis connection
      REDIS_URI: redis://redis:6379

      # RabbitMQ connection (if used)
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/

      # AI Service configuration
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT: 5s
      AI_SERVICE_MAX_RETRIES: 3
      AI_SERVICE_CIRCUIT_BREAKER_THRESHOLD: 5
      AI_SERVICE_CIRCUIT_BREAKER_TIMEOUT: 60
      AI_SERVICE_CIRCUIT_BREAKER_INTERVAL: 10
      AI_SERVICE_CIRCUIT_BREAKER_MAX_REQUESTS: 3
      AI_SERVICE_FAILURE_RATE_THRESHOLD: 0.5

      # Other configurations
      APP_ENV: ${APP_ENV:-local}
      APP_HOST: 0.0.0.0
      PORT: 7070
      GIN_MODE: ${GIN_MODE:-debug}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      JWT_SECRET_EXPIRY: ${JWT_SECRET_EXPIRY:-24h}

      # AWS/S3 (if used)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-celebut-bucket}

      # Email/SMS services
      SEND_GRID_API_KEY: ${SEND_GRID_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_MESSAGING_SERVICE_ID: ${TWILIO_MESSAGING_SERVICE_ID:-}

      # Analytics
      MIX_PANEL_PROJECT_TOKEN: ${MIX_PANEL_PROJECT_TOKEN:-}
      MIX_PANEL_API_SECRET: ${MIX_PANEL_API_SECRET:-}
      MIX_PANEL_USERNAME: ${MIX_PANEL_USERNAME:-}
      MIX_PANEL_PROJECT_ID: ${MIX_PANEL_PROJECT_ID:-}

      # Monitoring
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    ports:
      - "7070:7070"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/go/pkg/mod:/go/pkg/mod
    command: go run main.go

  # AI Service (Python/FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: celebut-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      # Service configuration
      APP_NAME: celebut-ai-service
      APP_VERSION: 1.0.0
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_HOST: 0.0.0.0
      PORT: 8000

      # AI Model configurations
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      TOXICITY_MODEL: unitary/toxic-bert

      # Redis for caching embeddings (optional)
      REDIS_URI: redis://redis:6379

      # File upload limits
      MAX_CONTENT_LENGTH: 16777216  # 16MB

      # Monitoring
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./ai-service:/app
      - ./ai-service/models:/app/models  # For caching downloaded models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Tempo for tracing (if using Jaeger/Tempo)
  tempo:
    image: grafana/tempo:2.0.0
    container_name: celebut-tempo
    restart: unless-stopped
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "4317:4317"   # OTLP gRPC
      - "3200:3200"   # Tempo UI

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: celebut-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - ai-service

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: celebut-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  tempo_data:
  prometheus_data:
  grafana_data: