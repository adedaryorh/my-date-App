basePath: /v1
definitions:
  auth.authRequest:
    properties:
      client_id:
        example: abcede
        type: string
      secret:
        example: password
        type: string
    required:
    - client_id
    - secret
    type: object
  auth.authResponse:
    properties:
      token:
        type: string
    type: object
  auth.createRequest:
    properties:
      client_id:
        example: abcede
        type: string
      client_name:
        example: Celebut iOS
        type: string
      secret:
        example: password
        type: string
    required:
    - client_id
    - client_name
    - secret
    type: object
  auth.createResponse:
    properties:
      message:
        type: string
    type: object
  auth.initialiseRegisterRequest:
    properties:
      account_type:
        example: 1
        type: integer
      email:
        example: user@email.com
        type: string
      phone_number:
        example: "0712345678"
        type: string
    required:
    - account_type
    type: object
  auth.initialiseRegisterResponse:
    properties:
      message:
        type: string
    type: object
  auth.loginRequest:
    properties:
      account_type:
        example: 1
        type: integer
      email:
        example: user@email.com
        type: string
      password:
        example: password
        type: string
    required:
    - account_type
    - email
    - password
    type: object
  auth.loginUserResponse:
    properties:
      status:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/dtos.User'
    type: object
  auth.registerBusinessRequest:
    properties:
      business_name:
        example: John XYZ Plc
        type: string
      country_code:
        example: "234"
        type: string
      email:
        example: business@email.com
        type: string
      industry_type:
        example: 1
        type: integer
      password:
        example: password
        type: string
      phone_number:
        example: "0712345678"
        type: string
    required:
    - business_name
    - industry_type
    - password
    type: object
  auth.registerResponse:
    properties:
      status:
        type: string
      user:
        $ref: '#/definitions/dtos.User'
    type: object
  auth.registerUserRequest:
    properties:
      country_code:
        example: "234"
        type: string
      dob:
        example: "2020-10-12"
        type: string
      email:
        example: user@email.com
        type: string
      first_name:
        example: John
        type: string
      gender:
        example: male
        type: string
      interests:
        example: fashion,entertainment
        type: string
      last_name:
        example: Doe
        type: string
      password:
        example: password
        type: string
      phone_number:
        example: "0712345678"
        type: string
      profile_image:
        format: base64
        type: string
      relationship_status:
        example: single
        type: string
      username:
        example: johndoe
        type: string
    required:
    - dob
    - first_name
    - last_name
    - password
    - username
    type: object
  auth.validateOTPRequest:
    properties:
      email:
        example: user@email.com
        type: string
      otp:
        example: "123456"
        type: string
      phone_number:
        example: "0712345678"
        type: string
    required:
    - otp
    type: object
  auth.validateOTPResponse:
    properties:
      token:
        type: string
    type: object
  business.createIndustryRequest:
    properties:
      description:
        example: description
        type: string
      name:
        example: Engineering
        type: string
    required:
    - description
    - name
    type: object
  business.getIndustryResponse:
    properties:
      industries:
        items:
          $ref: '#/definitions/dtos.Industry'
        type: array
      status:
        type: string
    type: object
  dtos.AccountType:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dtos.Industry:
    properties:
      id:
        type: integer
      name:
        type: string
      type:
        type: string
    type: object
  dtos.IndustryType:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dtos.PagedPosts:
    properties:
      limit:
        type: integer
      page:
        type: integer
      posts:
        items:
          $ref: '#/definitions/dtos.Post'
        type: array
    type: object
  dtos.PagedRelationships:
    properties:
      limit:
        type: integer
      page:
        type: integer
      users:
        items:
          $ref: '#/definitions/dtos.UserInfo'
        type: array
    type: object
  dtos.Post:
    properties:
      author:
        $ref: '#/definitions/dtos.UserInfo'
      comments:
        items:
          $ref: '#/definitions/dtos.Post'
        type: array
      comments_count:
        type: integer
      created_at:
        type: string
      media:
        items:
          $ref: '#/definitions/dtos.PostMedia'
        type: array
      message:
        type: string
      post_id:
        type: string
      reactions:
        items:
          $ref: '#/definitions/dtos.UserReaction'
        type: array
      reactions_count:
        type: integer
      updated_at:
        type: string
    type: object
  dtos.PostMedia:
    properties:
      alternate_text:
        type: string
      url:
        type: string
    type: object
  dtos.User:
    properties:
      account_type:
        $ref: '#/definitions/dtos.AccountType'
      business_name:
        type: string
      country_code:
        type: string
      dob:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      industry_type:
        $ref: '#/definitions/dtos.IndustryType'
      interests:
        type: string
      last_name:
        type: string
      phone_number:
        type: string
      relationship_status:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  dtos.UserInfo:
    properties:
      business_name:
        type: string
      first_name:
        type: string
      is_verified:
        type: boolean
      last_name:
        type: string
      profile_image:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  dtos.UserProfile:
    properties:
      account_type:
        $ref: '#/definitions/dtos.AccountType'
      bio:
        type: string
      businesses_count:
        type: integer
      celebrations_count:
        type: integer
      contents_count:
        type: integer
      country_code:
        type: string
      customers_count:
        type: integer
      dob:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      interests:
        type: string
      is_verified:
        type: boolean
      last_name:
        type: string
      location:
        type: string
      loved_ones_count:
        type: integer
      phone_number:
        type: string
      profile_image:
        type: string
      relationship_status:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  dtos.UserReaction:
    properties:
      reaction:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      developer_information:
        example: an error occurred
        type: string
      error:
        example: message
        type: string
      status:
        example: error
        type: string
    type: object
  handlers.editUserResponse:
    properties:
      status:
        type: string
      user:
        $ref: '#/definitions/dtos.User'
    type: object
  handlers.getUserResponse:
    properties:
      data:
        $ref: '#/definitions/dtos.UserProfile'
      status:
        type: string
    type: object
  handlers.resendOTPRequest:
    properties:
      email:
        example: user@email.com
        type: string
      mode:
        example: register
        type: string
      phone_number:
        example: "0712345678"
        type: string
    required:
    - mode
    type: object
  handlers.resendOTPResponse:
    properties:
      message:
        type: string
    type: object
  models.Industry:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        example: entertainment
        type: string
      updated_at:
        type: string
    type: object
  posts.addReactionRequest:
    properties:
      reaction:
        example: emoji
        type: string
    type: object
  posts.addReactionResponse:
    properties:
      post:
        $ref: '#/definitions/dtos.Post'
      status:
        type: string
    type: object
  posts.createCommentResponse:
    properties:
      post:
        $ref: '#/definitions/dtos.Post'
      status:
        type: string
    type: object
  posts.createPostResponse:
    properties:
      post:
        $ref: '#/definitions/dtos.Post'
      status:
        type: string
    type: object
  posts.deletePostResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  posts.getCommentData:
    properties:
      comments:
        $ref: '#/definitions/dtos.PagedPosts'
      post:
        $ref: '#/definitions/dtos.Post'
    type: object
  posts.getCommentsResponse:
    properties:
      data:
        $ref: '#/definitions/posts.getCommentData'
      status:
        type: string
    type: object
  posts.getFeedResponse:
    properties:
      data:
        $ref: '#/definitions/dtos.PagedPosts'
      status:
        type: string
    type: object
  posts.getPostsResponse:
    properties:
      data:
        $ref: '#/definitions/dtos.PagedPosts'
      status:
        type: string
    type: object
  posts.reportPostResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  relationships.followerResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  relationships.getCustomersResponse:
    properties:
      data:
        $ref: '#/definitions/dtos.PagedRelationships'
      status:
        type: string
    type: object
host: localhost:8083
info:
  contact: {}
  description: Celebut Backend REST endpoints
  title: Celebut API
  version: "1.0"
paths:
  /business/industry:
    get:
      consumes:
      - application/json
      description: Get list of business industries
      operationId: industries-list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/business.getIndustryResponse'
      security:
      - Auth-Token: []
      summary: Get industries
      tags:
      - Industries
    post:
      consumes:
      - application/json
      description: Create a new business industry
      operationId: create-industry
      parameters:
      - description: Create new industry
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/business.createIndustryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Industry'
      security:
      - Auth-Token: []
      summary: Create industry
      tags:
      - Industries
  /client:
    post:
      consumes:
      - application/json
      description: Create a new client
      operationId: create-client
      parameters:
      - description: Create a client
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.createRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.createResponse'
      summary: '[Admin] Create a client'
      tags:
      - Client
  /client/auth:
    post:
      consumes:
      - application/json
      description: Authenticate a client
      operationId: auth-client
      parameters:
      - description: Authenticate a client
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.authRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
      summary: Authenticate a client
      tags:
      - Authentication
  /comments/{postID}:
    get:
      consumes:
      - application/json
      description: Get Post Comments
      operationId: get-post-comments
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - description: post identifier
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/posts.getCommentsResponse'
      security:
      - Bearer: []
      summary: Get Post Comments
      tags:
      - Posts
    post:
      consumes:
      - multipart/form-data
      description: Add comment to a post
      operationId: create-comment
      parameters:
      - description: post identifier
        in: path
        name: postID
        required: true
        type: string
      - description: comments media
        in: formData
        items:
          type: file
        name: media
        type: array
      - example: What is happening?
        in: formData
        name: message
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/posts.createCommentResponse'
      security:
      - Bearer: []
      summary: Create post comment
      tags:
      - Posts
  /follow/{businessID}:
    post:
      consumes:
      - application/json
      description: Follow a business
      operationId: follow-business
      parameters:
      - description: business user identifier
        in: path
        name: businessID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/relationships.followerResponse'
      security:
      - Bearer: []
      summary: Follow business
      tags:
      - User Relationships
  /followers:
    get:
      consumes:
      - application/json
      description: Get businesses' followers
      operationId: get-followers
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/relationships.getCustomersResponse'
      security:
      - Bearer: []
      summary: Get followers
      tags:
      - User Relationships
  /login:
    post:
      consumes:
      - application/json
      description: Login a user
      operationId: login
      parameters:
      - description: Login user
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.loginUserResponse'
      security:
      - Auth-Token: []
      summary: User login
      tags:
      - Authentication
  /lovedones:
    get:
      consumes:
      - application/json
      description: Get user's loved ones
      operationId: get-loved-ones
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/relationships.getCustomersResponse'
      security:
      - Bearer: []
      summary: Get loved ones
      tags:
      - User Relationships
  /lovedones/{userID}:
    delete:
      consumes:
      - application/json
      description: Remove user's loved one
      operationId: remove-loved-one
      parameters:
      - description: user identifier
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/relationships.followerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Remove loved one
      tags:
      - User Relationships
    post:
      consumes:
      - application/json
      description: Become a loved one
      operationId: become-a-loved-one
      parameters:
      - description: user identifier
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/relationships.followerResponse'
      security:
      - Bearer: []
      summary: Become a loved one
      tags:
      - User Relationships
  /otp/resend:
    post:
      consumes:
      - application/json
      description: Resend OTP code
      operationId: resend-otp
      parameters:
      - description: Resend OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.resendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.resendOTPResponse'
      summary: Resend OTP
      tags:
      - OTP
  /posts:
    get:
      consumes:
      - application/json
      description: Get session user's posts
      operationId: get-posts
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/posts.getPostsResponse'
      security:
      - Bearer: []
      summary: Get Posts
      tags:
      - Posts
    post:
      consumes:
      - multipart/form-data
      description: Create a post
      operationId: create-post
      parameters:
      - description: posts media
        in: formData
        items:
          type: file
        name: media
        type: array
      - example: What is happening?
        in: formData
        name: message
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/posts.createPostResponse'
      security:
      - Bearer: []
      summary: Create Post
      tags:
      - Posts
  /posts/{postID}:
    delete:
      consumes:
      - application/json
      description: Delete a post
      operationId: delete-post
      parameters:
      - description: post identifier
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/posts.deletePostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete Post
      tags:
      - Posts
  /posts/{userID}:
    get:
      consumes:
      - application/json
      description: Get user's posts by user ID
      operationId: get-user-posts
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - description: user identifier
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/posts.getPostsResponse'
      security:
      - Bearer: []
      summary: Get User Posts by ID
      tags:
      - Posts
  /posts/feed:
    get:
      consumes:
      - application/json
      description: Get session user's feed
      operationId: get-posts-feed
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/posts.getFeedResponse'
      security:
      - Bearer: []
      summary: Get Posts Feed
      tags:
      - Posts
  /posts/reactions/{postID}:
    delete:
      consumes:
      - application/json
      description: Remove reaction from a post
      operationId: delete-post-reaction
      parameters:
      - description: post identifier
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/posts.addReactionResponse'
      security:
      - Bearer: []
      summary: Remove reaction
      tags:
      - Posts
    post:
      consumes:
      - application/json
      description: Add reaction to a post
      operationId: add-post-reaction
      parameters:
      - description: post identifier
        in: path
        name: postID
        required: true
        type: string
      - description: add a new reaction
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/posts.addReactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/posts.addReactionResponse'
      security:
      - Bearer: []
      summary: Add reaction to a post
      tags:
      - Posts
  /posts/report/{postID}:
    post:
      consumes:
      - application/json
      description: Report a post
      operationId: report-post
      parameters:
      - description: post identifier
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/posts.reportPostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Report post
      tags:
      - Posts
  /register/business:
    post:
      consumes:
      - application/json
      description: Complete business registration
      operationId: register-business
      parameters:
      - description: Complete a new business registration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.registerBusinessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.registerResponse'
      security:
      - Bearer: []
      summary: Complete business registration
      tags:
      - Authentication
  /register/initialise:
    post:
      consumes:
      - application/json
      description: Begin registration process
      operationId: initialise-register
      parameters:
      - description: begin a new registration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.initialiseRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.initialiseRegisterResponse'
      security:
      - Auth-Token: []
      summary: Initialise Registration
      tags:
      - Authentication
  /register/user:
    post:
