version: '3.8'

services:
  # Override backend for development with live reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - ./backend/go/pkg/mod:/go/pkg/mod
    command: air  # Using air for live reload in development
    environment:
      - GIN_MODE=debug
      - APP_ENV=local

  # Override AI service for development with reload
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./ai-service:/app
      - ./ai-service/models:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP_ENV=local
      - LOG_LEVEL=debug

# Development tools
  # Air for Go live reload (if needed)
  air:
    image: cosmtrek/air:latest
    volumes:
      - ./backend:/app
      - ~/.cache:/root/.cache
    working_dir: /app
    command: air -c .air.toml
    depends_on:
      - postgres
      - redis
    # Uncomment if you want to run air as a service
    # profiles: ["dev"]

  # Adminer for database management
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_DBMS=postgres
    depends_on:
      - postgres

  # Mongo Express for MongoDB-like interface (optional)
  mongo-express:
    image: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongo
    depends_on:
      - mongo
    # Uncomment if using MongoDB
    # profiles: ["dev"]

  # MongoDB (if needed alongside PostgreSQL)
  mongo:
    image: mongo:6
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    # Uncomment if using MongoDB
    # profiles: ["dev"]

volumes:
  mongo_data:
    driver: local